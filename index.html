<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment Inventory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="stage">
        <canvas id="world" aria-label="Forest clearing"></canvas>
        <p class="hint" id="hint">Click a tree or a rock to gather.</p>
      </main>

      <aside class="pack" aria-label="Inventory">
        <header class="pack-header">
          <p class="pack-kicker">Your pack</p>
          <h1>Experiment Inventory</h1>
        </header>

        <section class="gauges" aria-live="polite">
          <div class="gauge">
            <div class="gauge-row">
              <span>Weight</span>
              <span id="weight-label">0 / 20</span>
            </div>
            <div
              class="gauge-track"
              role="meter"
              aria-valuemin="0"
              aria-valuemax="20"
              aria-valuenow="0"
              id="weight-meter"
            >
              <div class="gauge-fill" id="weight-fill"></div>
            </div>
          </div>
          <div class="gauge">
            <div class="gauge-row">
              <span>Volume</span>
              <span id="volume-label">0 / 16</span>
            </div>
            <div
              class="gauge-track"
              role="meter"
              aria-valuemin="0"
              aria-valuemax="16"
              aria-valuenow="0"
              id="volume-meter"
            >
              <div class="gauge-fill is-volume" id="volume-fill"></div>
            </div>
          </div>
          <p class="gauge-note" id="carry-note">Plenty of room.</p>
        </section>

        <ul class="slots" id="slots"></ul>

        <p class="empty" id="empty">
          Nothing carried yet. Sticks are light but bulky. Stones are heavy and compact.
        </p>
      </aside>
    </div>
    <script src="game.js"></script>
  </body>
</html>
